name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Ruff, Mypy Strict, Pytest + Coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck with Mypy (--strict)
        run: uv run mypy backend/src
      - name: Run Unit & Integration Tests
        run: uv run pytest -v --cov=aetheris
      - name: Run SciFact-Aetheris Ablation Benchmark
        run: uv run aetheris eval

  frontend:
    name: Frontend (Next.js 15 TypeScript & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js Bundle
        run: npm run build

